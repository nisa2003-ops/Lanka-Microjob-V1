#!/bin/bash
set -e

echo "===== Lanka MicroJob CD Deployment ====="

AWS_REGION="ap-southeast-2"
IMAGE_TAG=$(cat image-tag.txt)

AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
  --query Account \
  --output text)

ECR_BASE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

echo "===== Configuring ECR authentication ====="

ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")

kubectl create secret docker-registry ecr-registry \
  --docker-server="$ECR_BASE" \
  --docker-username=AWS \
  --docker-password="$ECR_PASSWORD" \
  --dry-run=client -o yaml | kubectl apply -f -

kubectl patch serviceaccount default \
  -p '{"imagePullSecrets":[{"name":"ecr-registry"}]}'

echo "===== Deploying image tag: $IMAGE_TAG ====="

kubectl set image deployment/user-service \
  user-service=${ECR_BASE}/lanka-microjob-user-service:${IMAGE_TAG}

kubectl set image deployment/job-service \
  job-service=${ECR_BASE}/lanka-microjob-job-service:${IMAGE_TAG}

kubectl set image deployment/matching-service \
  matching-service=${ECR_BASE}/lanka-microjob-matching-service:${IMAGE_TAG}

kubectl set image deployment/broker-service \
  broker-service=${ECR_BASE}/lanka-microjob-broker-service:${IMAGE_TAG}

kubectl set image deployment/notification-service \
  notification-service=${ECR_BASE}/lanka-microjob-notification-service:${IMAGE_TAG}

kubectl set image deployment/api-gateway \
  api-gateway=${ECR_BASE}/lanka-microjob-api-gateway:${IMAGE_TAG}

kubectl set image deployment/frontend \
  frontend=${ECR_BASE}/lanka-microjob-frontend:${IMAGE_TAG}

echo "===== Restarting deployments ====="

kubectl rollout restart deployment/user-service
kubectl rollout restart deployment/job-service
kubectl rollout restart deployment/matching-service
kubectl rollout restart deployment/broker-service
kubectl rollout restart deployment/notification-service
kubectl rollout restart deployment/api-gateway
kubectl rollout restart deployment/frontend

echo "===== Waiting for rollouts ====="

kubectl rollout status deployment/user-service --timeout=600s
kubectl rollout status deployment/job-service --timeout=600s
kubectl rollout status deployment/matching-service --timeout=600s
kubectl rollout status deployment/broker-service --timeout=600s
kubectl rollout status deployment/notification-service --timeout=600s
kubectl rollout status deployment/api-gateway --timeout=600s
kubectl rollout status deployment/frontend --timeout=600s

kubectl get pods

echo "===== Deployment completed successfully ====="
